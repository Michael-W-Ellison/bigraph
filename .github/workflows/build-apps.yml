# Builds standalone apps (no Python needed) for Linux, Windows and macOS.
# Run it from the Actions tab, or push a tag such as v1.0.0 to also attach the
# apps to a GitHub release.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the app runs on older Linux systems too
          - os: ubuntu-22.04
            artifact: Bigraph-linux-x86_64
          - os: windows-latest
            artifact: Bigraph-windows-x86_64
          - os: macos-latest
            artifact: Bigraph-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk8.6

      - name: Install requirements
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build app
        run: pyinstaller packaging/bigraph.spec --distpath dist --workpath build --noconfirm

      - name: Self test the built app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) app=dist/Bigraph.exe ;;
            macOS) app=dist/Bigraph.app/Contents/MacOS/Bigraph ;;
            *) app=dist/Bigraph ;;
          esac
          set +e
          "$app" --self-test-report self-test.txt
          code=$?
          set -e
          cat self-test.txt
          # 0: everything works; 2: only the OS key store is missing, as on build servers
          if [ "$code" != 0 ] && [ "$code" != 2 ]; then exit 1; fi

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist Bigraph

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Bigraph.exe -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Bigraph.app ${{ matrix.artifact }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apps
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: apps/*
